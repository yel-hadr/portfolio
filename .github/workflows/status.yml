name: Status monitor

# Every 30 minutes: check the services and pipelines listed in status.config.json and publish the
# results next to the site, as https://yel-hadr.github.io/status.json (summary) and
# /status/history.json (7 days of samples), read by the /status/ page.
#
# GitHub Pages only serves static files, so the monitoring runs here. Only those two files are
# pushed (keep_files), with the same deploy key as deploy.yml; the site itself is untouched.

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest and delays runs the most
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # GitHub keeps one pending run per concurrency group, and a newly queued one cancels the pending
  # one (cancel-in-progress only spares the running one). So if this job queued in pages-deploy
  # while a site deploy was waiting there, it would cancel that deploy and the latest commit would
  # not go live until the next push. This first job has no concurrency group: it looks for a
  # deploy.yml run of a push to main that has not finished yet and, if there is one, the publish
  # job below is skipped. One missed 30-minute sample is harmless; a missed deploy is not.
  # The window between this check and the publish job queueing is a few seconds.
  gate:
    name: wait-for-no-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.deploys.outputs.should_run }}
    steps:
      - name: Look for a site deploy queued or in progress
        id: deploys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Any status but completed (queued, in_progress, waiting, pending, requested) counts. If
        # the API cannot be read, the publish job still runs: the shared group below still keeps
        # the two from pushing at the same time.
        run: |
          if ! active=$(gh api \
            'repos/yel-hadr/portfolio/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20' \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length'); then
            echo "::warning::Could not list the deploy.yml runs: publishing anyway."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$active" -gt 0 ]; then
            echo "A site deploy is queued or in progress ($active run(s)): skipping this status run so it cannot cancel the deploy."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No site deploy queued or in progress: publishing."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check-and-publish
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with the deploy-to-pages job of deploy.yml: a site deploy and a status publish never
    # push to yel-hadr.github.io at the same time, and each reads the other's latest result. At job
    # level, so the gate above runs outside the group.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the checks
        # No dependencies to install: Node's built-in fetch only. Exits 0 when monitors are down
        # (the JSON says so); a failure here means a bug or a broken status.config.json.
        run: node scripts/status/check.mjs --out out
        env:
          # Reads the workflow runs of the pipelines (public repos) and the published history
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Grafana Cloud push (Influx line protocol); unset = skipped
          GRAFANA_INFLUX_URL: ${{ secrets.GRAFANA_INFLUX_URL }}
          GRAFANA_INFLUX_USER: ${{ secrets.GRAFANA_INFLUX_USER }}
          GRAFANA_INFLUX_TOKEN: ${{ secrets.GRAFANA_INFLUX_TOKEN }}

      - name: Commit time
        id: time
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Publish status.json and status/history.json
        # Same pinned action as deploy.yml (this job holds a write deploy key). keep_files leaves
        # every other file of the branch as it is, so only the two JSON files change.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: yel-hadr/yel-hadr.github.io
          publish_branch: main
          publish_dir: ./out
          keep_files: true
          full_commit_message: 'status: ${{ steps.time.outputs.iso }}'
