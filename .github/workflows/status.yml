name: Status monitor

# Runs about every 30 minutes. Checks the services and pipelines listed in status.config.json and
# publishes the results next to the site, as https://yel-hadr.github.io/status.json (summary) and
# /status/history.json (7 days of samples), read by the /status/ page.
#
# The cadence is a self-dispatching chain, not the cron below: GitHub runs schedules best-effort
# (measured every 2-7 h, median 4.5 h). Each run ends with the `next` job, which waits on the
# status-cadence environment's 28-minute wait timer (not billed, no runner held) and then
# dispatches the next run; workflow_dispatch is the one event GITHUB_TOKEN may trigger. The cron
# stays as a backstop that restarts the chain if a link ever fails. To stop the chain, cancel the
# waiting run or disable the workflow.
#
# GitHub Pages only serves static files, so the monitoring runs here. Only those two files are
# pushed (keep_files), with the same deploy key as deploy.yml; the site itself is untouched.

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest and delays runs the most
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      grafana_backfill:
        description: 'Backfill Grafana: also push the published 7-day history (needs the GRAFANA_INFLUX_* secrets)'
        type: boolean
        default: false
      chain_test:
        description: 'Off main: test one link of the 30-minute chain (waits, then dispatches one run that stops)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # GitHub keeps one pending run per concurrency group, and a newly queued one cancels the pending
  # one (cancel-in-progress only spares the running one). So if this job queued in pages-deploy
  # while a site deploy was waiting there, it would cancel that deploy and the latest commit would
  # not go live until the next push. This first job has no concurrency group: it looks for a
  # deploy.yml run of a push to main that has not finished yet and, if there is one, the publish
  # job below is skipped. One missed sample is harmless; a missed deploy is not.
  # The window between this check and the publish job queueing is a few seconds.
  gate:
    name: wait-for-no-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.deploys.outputs.should_run }}
    steps:
      - name: Look for a site deploy queued or in progress
        id: deploys
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Any status but completed (queued, in_progress, waiting, pending, requested) counts. If
        # the API cannot be read, the publish job still runs: the shared group below still keeps
        # the two from pushing at the same time.
        run: |
          if ! active=$(gh api \
            'repos/yel-hadr/portfolio/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=20' \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length'); then
            echo "::warning::Could not list the deploy.yml runs: publishing anyway."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$active" -gt 0 ]; then
            echo "A site deploy is queued or in progress ($active run(s)): skipping this status run so it cannot cancel the deploy."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No site deploy queued or in progress: publishing."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check-and-publish
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with the deploy-to-pages job of deploy.yml: a site deploy and a status publish never
    # push to yel-hadr.github.io at the same time, and each reads the other's latest result. At job
    # level, so the gate above runs outside the group.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the checks
        # No dependencies to install: Node's built-in fetch only. Exits 0 when monitors are down
        # (the JSON says so); a failure here means a bug or a broken status.config.json.
        run: node scripts/status/check.mjs --out out
        env:
          # Reads the workflow runs of the pipelines (public repos) and the published history
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Grafana Cloud push (Influx line protocol); unset = skipped
          GRAFANA_INFLUX_URL: ${{ secrets.GRAFANA_INFLUX_URL }}
          GRAFANA_INFLUX_USER: ${{ secrets.GRAFANA_INFLUX_USER }}
          GRAFANA_INFLUX_TOKEN: ${{ secrets.GRAFANA_INFLUX_TOKEN }}

      - name: Backfill Grafana with the 7-day history
        # Manual runs only (the "Backfill Grafana" box). Replays this run's history file so a new
        # Grafana dashboard starts with a week of data; re-running overwrites the same points.
        if: github.event_name == 'workflow_dispatch' && inputs.grafana_backfill
        run: node scripts/status/grafana-backfill.mjs --history out/status/history.json --summary out/status.json
        env:
          GRAFANA_INFLUX_URL: ${{ secrets.GRAFANA_INFLUX_URL }}
          GRAFANA_INFLUX_USER: ${{ secrets.GRAFANA_INFLUX_USER }}
          GRAFANA_INFLUX_TOKEN: ${{ secrets.GRAFANA_INFLUX_TOKEN }}

      - name: Commit time
        id: time
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Publish status.json and status/history.json
        # Same pinned action as deploy.yml (this job holds a write deploy key). keep_files leaves
        # every other file of the branch as it is, so only the two JSON files change. Only the
        # workflow on main publishes: a manual run on another branch checks without going live.
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: yel-hadr/yel-hadr.github.io
          publish_branch: main
          publish_dir: ./out
          keep_files: true
          full_commit_message: 'status: ${{ steps.time.outputs.iso }}'

  # The 30-minute cadence (see the top of this file). Runs whether the check published, skipped
  # for a deploy or failed, so one bad check does not end the chain; a cancelled run does.
  next:
    name: schedule-next-run
    needs: [gate, check]
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || inputs.chain_test) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Its 28-minute wait timer holds this job before it starts (Settings > Environments)
    environment: status-cadence
    permissions:
      actions: write
    steps:
      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        # Two guards keep this from looping or forking:
        # - Without the wait timer this job would start a minute after the run, and each run would
        #   dispatch the next straight away. So it only dispatches after 20 minutes.
        # - The newest active run carries the chain: if a newer one exists (a cron or manual run
        #   started meanwhile), this one stops, so two chains merge back into one.
        # Any API error ends the chain quietly; the cron above restarts it.
        run: |
          if ! started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .run_started_at); then
            echo "::warning::Could not read this run: not dispatching (the cron schedule restarts the chain)."
            exit 0
          fi
          waited=$(( $(date +%s) - $(date -d "$started" +%s) ))
          if [ "$waited" -lt 1200 ]; then
            echo "::warning::Only ${waited}s since this run started: the status-cadence environment has no wait timer. Not dispatching, so this cannot loop."
            exit 0
          fi
          if ! newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/status.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and .id > $RUN_ID and .head_branch == \"$REF\")] | length"); then
            echo "::warning::Could not list the status runs: not dispatching (the cron schedule restarts the chain)."
            exit 0
          fi
          if [ "$newer" -gt 0 ]; then
            echo "A newer status run is active and carries the chain: not dispatching."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/status.yml/dispatches" -f ref="$REF"
          echo "Waited ${waited}s; dispatched the next status run on $REF."
