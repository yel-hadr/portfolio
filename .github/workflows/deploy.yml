name: CI/CD Pipeline

# Pull requests to main: lint, format, security audit, build and Lighthouse (PR checks).
# Pushes to main: the same checks, then publish the tested build to GitHub Pages.
#
# The site is a GitHub Pages *user* site: Pages serves the main branch of
# yel-hadr/yel-hadr.github.io at https://yel-hadr.github.io/ (vite.config.js base: '/').
# This repo's GITHUB_TOKEN cannot push to another repository, so the deploy uses an SSH
# deploy key: the public half is a write-enabled deploy key on yel-hadr.github.io, the
# private half is this repo's ACTIONS_DEPLOY_KEY secret.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or ref): a new push to a pull request cancels the run in progress. Pushes to
# main are never cancelled mid-run, so a deploy always finishes (the deploy job also queues on
# pages-deploy with the status monitor)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # npm's download cache (~/.npm), for the installs that miss the node_modules cache
          cache: npm

      # node_modules itself, keyed on the exact lockfile and Node version: a hit skips npm ci
      # (which would delete node_modules and reinstall); any dependency change misses
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install (npm ci)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Security audit (production dependencies)
        # Fails on any high or critical advisory in what ships to visitors
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # The contact endpoint (deployed by Vercel, not here): its own dependencies, audit and tests
      - name: Contact endpoint tests
        working-directory: contact-api
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test

      - name: Build
        run: npm run build
        env:
          # The contact form's endpoint (contact-api, a Vercel function): a public URL, so a
          # repository *variable*. The Resend key lives only in the Vercel project. Unset: the
          # build still succeeds and the form says it is not configured.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
          # Optional, non-secret (repository *variables*, not secrets). Unset = feature off:
          # Umami analytics (cookieless) and the Grafana dashboard embedded on /status/.
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_SCRIPT_URL: ${{ vars.VITE_UMAMI_SCRIPT_URL }}
          VITE_GRAFANA_DASHBOARD_URL: ${{ vars.VITE_GRAFANA_DASHBOARD_URL }}

      - name: Check asset paths
        # Every URL in index.html must start with /assets/ (base '/'); a /portfolio/ prefix
        # would mean a stale base path and a broken live site. The <noscript> fallback is
        # skipped: its links are pages (resume, blog, mailto), not assets.
        run: |
          bad=$(sed '/<noscript>/,/<\/noscript>/d' dist/index.html | grep -oE '(src|href)="[^"]+"' | grep -vE '"(/assets/|https://)' || true)
          if [ -n "$bad" ]; then echo "Unexpected asset URLs:"; echo "$bad"; exit 1; fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: lint-and-test
    # The PR gate: performance, accessibility and best practices must each score >= 90
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install (npm ci)
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI (desktop)
        # lighthouserc.json: `vite preview` of the tested build, the desktop preset, the median of
        # five runs, asserted against the 0.9 thresholds. Reports stay in this run's artifacts
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Lighthouse CI (mobile)
        # lighthouserc.mobile.json: Lighthouse's emulated low-end phone, the median of three runs.
        # Accessibility and best practices fail below 0.9; performance below 0.9 only warns, as an
        # animated canvas and WebGL on that emulated phone stay near 0.5 (0.31 before Phase 9)
        if: always()
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json

      - name: Scores
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const pct = (v) => Math.round(v * 100);
            for (const [label, dir] of [["desktop", ".lighthouseci/reports"], ["mobile", ".lighthouseci/mobile"]]) {
              if (!fs.existsSync(`${dir}/manifest.json`)) continue;
              const runs = JSON.parse(fs.readFileSync(`${dir}/manifest.json`, "utf8"));
              const med = runs.find((r) => r.isRepresentativeRun) || runs[0];
              const rows = Object.entries(med.summary).map(([k, v]) => `| ${k} | ${pct(v)} | ${runs.map((r) => pct(r.summary[k])).join(" / ")} |`);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [`### Lighthouse (${label}, median of ${runs.length} runs)`, "", "| Category | Median | Runs |", "| --- | --- | --- |", ...rows, ""].join("\n"));
            }
          '

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: |
            .lighthouseci/reports
            .lighthouseci/mobile
          retention-days: 14

  deploy-to-pages:
    name: deploy-to-pages
    needs: lint-and-test
    # Never from pull requests: only after lint and build pass on a push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of racing.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    # Deployment history with the live URL. Not "github-pages": that environment was created
    # by this repo's old project-site Pages and only allows the gh-pages branch to deploy.
    environment:
      name: yel-hadr.github.io
      url: https://yel-hadr.github.io/
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Keep the monitoring data
        # The publish below replaces the branch with dist/; carry over the two files the Status
        # monitor (status.yml) writes, so a site deploy does not reset them. Read from the branch
        # first (no CDN delay right after a monitor run), then from the live site. Missing files
        # (before the first monitor run) are fine.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/status
          for file in status.json status/history.json; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/yel-hadr/yel-hadr.github.io/contents/$file?ref=main" -o "dist/$file.tmp" \
              || curl -fsSL "https://yel-hadr.github.io/$file?ts=$(date +%s)" -o "dist/$file.tmp" \
              || true
            # Keep only valid JSON: never publish an error page as status data
            if [ -s "dist/$file.tmp" ] && jq empty "dist/$file.tmp" 2>/dev/null; then
              mv "dist/$file.tmp" "dist/$file"
            else
              rm -f "dist/$file.tmp"
            fi
          done
          ls -l dist/status.json dist/status/history.json 2>/dev/null || true

      - name: Publish to yel-hadr.github.io (main)
        # Pinned to the commit behind the v4 tag (v4.1.0): this job holds a write deploy key,
        # so a moved tag must not change the code that runs with it.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: yel-hadr/yel-hadr.github.io
          publish_branch: main
          publish_dir: ./dist
          # Replaces the branch contents with dist/ and writes .nojekyll (enable_jekyll
          # defaults to false), like `npx gh-pages -d dist --nojekyll`.
          full_commit_message: Deploy yel-hadr/portfolio@${{ github.sha }}

  # The contact form's endpoint (contact-api/) on Vercel, deployed from here with GitHub secrets:
  # VERCEL_TOKEN (a Vercel access token), RESEND_API_KEY and CONTACT_TO. Runs on pushes to main and
  # on a manual run (so a branch's endpoint can go live before it merges). Without VERCEL_TOKEN it
  # only leaves a notice. The site reads the endpoint's URL from the VITE_CONTACT_ENDPOINT variable;
  # this job prints that URL and warns while the variable differs.
  deploy-contact-api:
    name: deploy-contact-api
    needs: lint-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT: yel-hadr-contact
    steps:
      - name: Without a Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN is not set, so the contact endpoint was not deployed"

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Created once, by name; later runs find it
      - name: Vercel project
        if: env.VERCEL_TOKEN != ''
        run: |
          api() { curl -sS -o /tmp/vercel.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' "$@"; }
          code=$(api "https://api.vercel.com/v9/projects/$PROJECT")
          if [ "$code" = 404 ]; then
            code=$(api -X POST https://api.vercel.com/v11/projects -d "{\"name\":\"$PROJECT\"}")
            echo "Created the Vercel project $PROJECT ($code)"
          fi
          case "$code" in
            200|201) ;;
            *) echo "::error::Vercel answered $code: $(jq -r '.error.message // "no message"' /tmp/vercel.json)"; exit 1 ;;
          esac

      # The secrets reach the function as runtime environment variables; GitHub masks them in logs
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        working-directory: contact-api
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$CONTACT_TO" ]; then
            echo "::error::Set the RESEND_API_KEY and CONTACT_TO secrets"; exit 1
          fi
          npx --yes vercel@64.3.1 deploy --prod --yes --token "$VERCEL_TOKEN" --project "$PROJECT" \
            --env RESEND_API_KEY="$RESEND_API_KEY" --env CONTACT_TO="$CONTACT_TO" > /tmp/deployment-url.txt
          echo "Deployed $(cat /tmp/deployment-url.txt)"

      # The production domain (public; deployment URLs sit behind Vercel's protection), checked with
      # the preflight the site's browsers send
      - name: Check the endpoint
        if: env.VERCEL_TOKEN != ''
        env:
          CONFIGURED: ${{ vars.VITE_CONTACT_ENDPOINT }}
        run: |
          domain=$(curl -sSf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT/domains?production=true" \
            | jq -r '([.domains[].name | select(endswith(".vercel.app"))] + [.domains[0].name])[0]')
          url="https://$domain/api/contact"
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: https://yel-hadr.github.io' -H 'Access-Control-Request-Method: POST' "$url")
            [ "$status" = 204 ] && break
            sleep 5
          done
          [ "$status" = 204 ] || { echo "::error::$url answered $status to the site's preflight"; exit 1; }
          echo "### Contact endpoint" >> "$GITHUB_STEP_SUMMARY"
          echo "Live at \`$url\` (preflight from the site: $status)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONFIGURED" != "$url" ]; then
            echo "::warning::Set the VITE_CONTACT_ENDPOINT repository variable to $url, then redeploy the site"
          fi
