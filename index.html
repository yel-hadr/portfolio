    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Youssef El Hadraoui (Jebril), Software Engineer in cloud infrastructure and DevOps: experience, projects, education and contact."
    />
    <title>Youssef El Hadraoui | Portfolio</title>
    <!-- Canonical, Open Graph, Twitter, RSS links, JSON-LD and analytics are added at build time
         by build/seo.js, from this title and description (core.json meta.* in English). -->
    <script>
      // Before the first paint: theme (saved choice, else dark) and language
      // (saved choice, else the browser's), so the page never flashes the wrong one.
      (function () {
        var root = document.documentElement;
        var theme, lang;
        try {
          theme = localStorage.getItem('theme');
          lang = localStorage.getItem('lang');
        } catch (e) {}
        // Dark is the site's default look; light only when the visitor picked it
        if (theme !== 'light') theme = 'dark';
        if (lang !== 'en' && lang !== 'fr') {
          lang = /^fr\b/i.test(navigator.language || '') ? 'fr' : 'en';
        }
        root.dataset.theme = theme;
        root.lang = lang;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#faf7f2' : '#0b0e14';
        document.querySelector('meta[name="color-scheme"]').content = theme;
      })();
    </script>
  </head>
